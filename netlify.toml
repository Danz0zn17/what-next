[build]
  publish = "landing"
  functions = "netlify/functions"

# The landing page and the signup function need none of the root package.json
# dependencies (native modules for the MCP server). Skip Netlify's automatic
# npm install, which fails on them and kills the build before it starts.
[build.environment]
  NPM_FLAGS = "--dry-run"

[[redirects]]
  from   = "/sitemap.xml"
  to     = "/sitemap.xml"
  status = 200

[[redirects]]
  from   = "/robots.txt"
  to     = "/robots.txt"
  status = 200

[[redirects]]
  from   = "/terms"
  to     = "/terms.html"
  status = 200

[[redirects]]
  from   = "/*"
  to     = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
