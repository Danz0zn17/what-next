name: Publish to npm

# Publishes whatnext-ai when a v* tag is pushed. Uses npm trusted publishing
# (GitHub OIDC), so no npm token is stored anywhere. One-time setup on
# npmjs.com: whatnext-ai > Settings > Trusted publisher > GitHub Actions,
# owner Danz0zn17, repository what-next, workflow publish.yml.
#
# Manual run (workflow_dispatch) publishes an existing tag, for tags pushed
# before this workflow existed.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to publish, e.g. v2.5.4'
        required: true

permissions:
  contents: read
  id-token: write

concurrency:
  group: npm-publish
  cancel-in-progress: false

env:
  ONNXRUNTIME_NODE_INSTALL_CUDA: skip

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve tag
        id: tag
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          TAG="${INPUT_TAG:-$GITHUB_REF_NAME}"
          case "$TAG" in v[0-9]*) ;; *) echo "Not a version tag: $TAG"; exit 1 ;; esac
          echo "name=$TAG" >> "$GITHUB_OUTPUT"

      - name: Checkout tag
        uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ steps.tag.outputs.name }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm

      - name: Check tag matches package version
        env:
          TAG: ${{ steps.tag.outputs.name }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if [ "v$VERSION" != "$TAG" ]; then
            echo "Tag $TAG does not match package.json version $VERSION"; exit 1
          fi
          if npm view "whatnext-ai@$VERSION" version >/dev/null 2>&1; then
            echo "whatnext-ai@$VERSION is already on npm"; exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm run test:ci

      # Provenance checks repository.url against this repo. Tags cut before the
      # field was added to package.json get it set here.
      - name: Set repository field
        run: |
          if [ -z "$(npm pkg get repository.url | tr -d '"{}')" ]; then
            npm pkg set repository.type=git repository.url=git+https://github.com/Danz0zn17/what-next.git
          fi

      # Trusted publishing needs npm 11.5.1 or newer. Upgraded after npm ci: newer
      # npm blocks the native install scripts (better-sqlite3) that the tests need.
      - name: Update npm
        run: npm install -g npm@latest

      - name: Publish
        # Verbose shows the OIDC token exchange, so a trusted publisher mismatch is visible.
        run: npm publish --access public --loglevel verbose
